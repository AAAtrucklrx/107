name: Android mobile
on:
  push:
    paths: ['mobile/**', 'frontend/**', 'xiaowo_web/**', 'services/**', 'agents/**', 'tools/**', 'utils/**', 'knowledge/**', 'database/**', 'tests/**', 'config.py', 'requirements*.txt', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', 'frontend/**', 'xiaowo_web/**', 'services/**', 'agents/**', 'tools/**', 'utils/**', 'knowledge/**', 'database/**', 'tests/**', 'config.py', 'requirements*.txt', '.github/workflows/mobile.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: npm ci --prefix frontend
      - run: npm ci --prefix mobile
      - run: npm test --prefix frontend
      - run: node --test mobile/scripts/build-config.test.mjs
      - run: npm run build:debug --prefix mobile
      - name: Native unit tests
        working-directory: mobile/android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug
      - name: Compile instrumentation tests
        working-directory: mobile/android
        run: ./gradlew --no-daemon :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: xiaowo-debug-apk
          path: |
            mobile/artifacts/*.apk
            mobile/artifacts/*.sha256
          retention-days: 7
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHON_DOTENV_DISABLED: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/web mobile/scripts/test_dev_server.py -q -rs
